<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>วัดความเร็วระบบ</title>
<!--
  หน้าชั่วคราวของขั้น 2 (ย้ายไปฐานข้อมูลจริง): วัดว่าระบบใหม่เร็วกว่าระบบเดิมแค่ไหนบนมือถือจริง
  ใช้ข้อมูลร้านทดลอง demo (ข้อมูลปลอม) — ลบหน้านี้ + api/_lib/speed.js ก่อนรวมเข้าเว็บจริง
  ไม่มีลิงก์จากหน้าอื่นมาที่นี่ / ข้อความไม่พูดถึงที่เก็บข้อมูล (หน้านี้ใครมีลิงก์ก็เปิดได้)
  ?old=<ลิงก์> ใช้แทนระบบเดิมตอนทดสอบในเครื่อง / ?rounds=<จำนวน> รอบต่อแบบ (ค่าเริ่มต้น 10)
-->
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb; --good: #15803d; --bad: #b91c1c; --btn: #1d4ed8; --btn-text: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #1a1d24; --text: #e7e9ee; --muted: #9aa1ad; --line: #2b2f38; --good: #4ade80; --bad: #f87171; --btn: #3b82f6; --btn-text: #fff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 0 0 12px; }
  .hint { font-size: 14px; color: var(--muted); }
  .hint li { margin: 2px 0; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 14px 18px; width: 100%; background: var(--btn); color: var(--btn-text); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost { background: transparent; color: var(--btn); border: 1px solid var(--btn); margin-top: 8px; }
  #status { min-height: 24px; margin: 10px 0; color: var(--muted); font-size: 14px; }
  .row-title { font-weight: 600; }
  .row-note { font-size: 13px; color: var(--muted); }
  .nums { display: flex; gap: 16px; margin-top: 8px; align-items: baseline; flex-wrap: wrap; }
  .big { font-size: 28px; font-weight: 700; }
  .small { font-size: 13px; color: var(--muted); }
  .err { color: var(--bad); font-size: 14px; margin-top: 6px; }
  .verdict { font-weight: 600; }
  .verdict.good { color: var(--good); }
  .verdict.bad { color: var(--bad); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: var(--bg); padding: 10px; border-radius: 10px; margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>วัดความเร็วระบบ</h1>
  <p class="sub">หน้าทดสอบชั่วคราว ใช้ข้อมูลร้านทดลอง (ข้อมูลปลอม)</p>

  <div class="card hint">
    <ul style="margin:0;padding-left:20px">
      <li>กดเริ่มแล้วรอราว 1 นาที อย่าสลับไปแอปอื่นระหว่างวัด</li>
      <li>วัด 2 รอบ: ต่อ Wi-Fi รอบหนึ่ง และปิด Wi-Fi (ใช้ 4G/5G) อีกรอบ</li>
      <li>ได้ผลแล้วกด "คัดลอกผล" แล้ววางส่งให้ Claude</li>
    </ul>
  </div>

  <button id="go" type="button">เริ่มวัด</button>
  <div id="status" role="status"></div>
  <div id="results"></div>

  <div class="card" id="summary" hidden>
    <div id="verdict" class="verdict"></div>
    <pre id="text"></pre>
    <button id="copy" class="ghost" type="button">คัดลอกผล</button>
  </div>
</main>

<script type="module">
const params = new URLSearchParams(location.search);
const ROUNDS = Math.min(30, Math.max(3, Number(params.get('rounds')) || 10));
const GOAL_MS = 500; // เกณฑ์ที่ตกลงกันไว้: เปิดบัตรสะสมแต้มไม่เกิน 0.5 วินาที

async function oldSystemUrl() {
  if (params.get('old')) return params.get('old');
  try { return (await import('./shops/khamwan/config.js')).default.apiUrl || ''; } catch (e) { return ''; }
}

// แสดงตามลำดับนี้ / วัดระบบใหม่ก่อน (ครั้งแรกของระบบใหม่จะได้เป็นครั้งแรกจริงๆ หลังเปิดหน้า)
const TESTS = [
  { key: 'old', title: '(ก) ระบบเดิม', note: 'คำสั่งเปล่า ไม่อ่านข้อมูลใดๆ — ใช้งานจริงช้ากว่านี้อีก', body: () => ({ action: 'ping' }) },
  { key: 'ping', title: '(ข) ระบบใหม่ แบบเปล่า', note: 'ไปกลับตัวกลางอย่างเดียว ไม่แตะข้อมูล', url: '/api', body: () => ({ action: 'ping' }) },
  { key: 'card', title: '(ค) ระบบใหม่ เปิดบัตรสะสมแต้ม', note: 'ดึงข้อมูลชุดเดียวกับตอนลูกค้าเปิดบัตร (สุ่มลูกค้า 1 ใน 2,000 คน)', url: '/api', body: () => ({ action: 'speedCard', shop: 'demo' }) },
  { key: 'heavy', title: '(ง) ระบบใหม่ ลูกค้าประจำ', note: 'ลูกค้าที่มีประวัติราว 600 รายการ', url: '/api', body: () => ({ action: 'speedCard', shop: 'demo', n: 1 }) }
];
const RUN_ORDER = ['ping', 'card', 'heavy', 'old'];

const $ = (id) => document.getElementById(id);
const sec = (ms) => (ms / 1000).toFixed(2) + ' วิ';
const median = (a) => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

async function once(url, body) {
  const t = performance.now();
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    cache: 'no-store'
  });
  const json = await res.json();
  return { ms: performance.now() - t, json };
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text; // ข้อความจากระบบใส่ผ่าน textContent เท่านั้น
  return e;
}

function renderRow(test, r) {
  const card = el('div', 'card');
  card.append(el('div', 'row-title', test.title), el('div', 'row-note', test.note));
  if (r.skipped) { card.append(el('div', 'err', r.skipped)); return card; }
  if (r.error) { card.append(el('div', 'err', r.error)); return card; }
  const nums = el('div', 'nums');
  nums.append(el('span', 'big', sec(r.median)), el('span', 'small', 'ค่ากลาง'),
              el('span', 'small', 'ครั้งแรก ' + sec(r.first)), el('span', 'small', 'ช้าสุด ' + sec(r.max)));
  card.append(nums);
  if (r.server) card.append(el('div', 'small', r.server));
  return card;
}

async function runTest(test, oldUrl) {
  const url = test.key === 'old' ? oldUrl : test.url;
  if (!url) return { skipped: 'ข้ามแบบนี้: หาที่อยู่ระบบเดิมไม่เจอ' };
  const times = [];
  let first = null, firstJson = null, last = null;
  const dbMs = [];
  for (let i = 0; i <= ROUNDS; i++) {
    let r;
    try { r = await once(url, test.body()); } catch (e) { return { error: 'เชื่อมต่อไม่ได้ (' + (e && e.message || e) + ')' }; }
    // ระบบใหม่ต้องตอบ ok / ระบบเดิมตอบ "ไม่รู้จักคำสั่ง" ก็ถือว่าวัดได้ (ตั้งใจส่งคำสั่งเปล่า)
    if (test.key !== 'old' && !r.json.ok) return { error: (r.json.error || 'ผิดพลาด') + ' [' + (r.json.code || '') + ']' };
    if (i === 0) { first = r.ms; firstJson = r.json; } else times.push(r.ms);
    if (typeof r.json.dbMs === 'number' && i > 0) dbMs.push(r.json.dbMs);
    last = r.json;
    $('status').textContent = 'กำลังวัด ' + test.title + ' ครั้งที่ ' + (i + 1) + '/' + (ROUNDS + 1);
  }
  const out = { first, median: median(times), max: Math.max(...times) };
  if (test.key !== 'old' && last) {
    const parts = ['ตัวกลางอยู่ที่ ' + (last.region || '?')];
    if (firstJson && firstJson.cold) parts.push('ครั้งแรกเป็นเครื่องที่เพิ่งเปิด');
    if (dbMs.length) parts.push('ฐานข้อมูลใช้ ' + median(dbMs).toFixed(1) + ' ms');
    if (last.counts) parts.push('ประวัติ ' + last.counts.tx + ' รายการ');
    out.server = parts.join(' · ');
    out.region = last.region;
    if (dbMs.length) out.dbMs = median(dbMs);
  }
  return out;
}

function deviceText() {
  const ua = navigator.userAgent;
  const inLine = /\bLine\//i.test(ua);
  const os = /iPhone|iPad/.test(ua) ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : 'คอม';
  const net = navigator.connection && navigator.connection.effectiveType ? ' · เน็ต ' + navigator.connection.effectiveType : '';
  return os + (inLine ? ' · ในแอป LINE' : ' · เบราว์เซอร์') + net;
}

$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  $('summary').hidden = true;
  $('results').textContent = '';
  const oldUrl = await oldSystemUrl();
  const results = {};
  for (const key of RUN_ORDER) {
    const test = TESTS.find(t => t.key === key);
    results[key] = await runTest(test, oldUrl);
  }
  $('status').textContent = 'เสร็จแล้ว';
  TESTS.forEach(t => $('results').append(renderRow(t, results[t.key])));

  const card = results.card, old = results.old;
  const v = $('verdict');
  if (card && card.median != null) {
    const pass = card.median <= GOAL_MS;
    v.className = 'verdict ' + (pass ? 'good' : 'bad');
    v.textContent = (pass ? '✓ ผ่านเกณฑ์' : '✗ ยังไม่ถึงเกณฑ์') + ': เปิดบัตรสะสมแต้ม ' + sec(card.median) + ' (เกณฑ์ไม่เกิน ' + sec(GOAL_MS) + ')'
      + (old && old.median ? ' · เร็วกว่าระบบเดิมราว ' + (old.median / card.median).toFixed(1) + ' เท่า' : '');
  } else {
    v.className = 'verdict bad';
    v.textContent = 'วัดระบบใหม่ไม่ได้ ดูข้อความสีแดงด้านบน';
  }

  const now = new Date();
  const lines = ['ผลวัดความเร็ว ' + now.toLocaleString('th-TH'), 'เครื่อง: ' + deviceText(), ''];
  TESTS.forEach(t => {
    const r = results[t.key];
    if (r.skipped || r.error) lines.push(t.title + ': ' + (r.skipped || r.error));
    else lines.push(t.title + ': กลาง ' + sec(r.median) + ' · ครั้งแรก ' + sec(r.first) + ' · ช้าสุด ' + sec(r.max)
      + (r.dbMs != null ? ' · ฐานข้อมูล ' + r.dbMs.toFixed(1) + ' ms' : ''));
  });
  const region = (results.ping && results.ping.region) || (card && card.region);
  if (region) lines.push('', 'ตัวกลางอยู่ที่: ' + region);
  lines.push(v.textContent);
  $('text').textContent = lines.join('\n');
  $('summary').hidden = false;
  $('go').disabled = false;
  $('go').textContent = 'วัดอีกครั้ง';
});

$('copy').addEventListener('click', async () => {
  const text = $('text').textContent;
  try {
    await navigator.clipboard.writeText(text);
    $('copy').textContent = 'คัดลอกแล้ว ✓';
  } catch (e) {
    // บางแอป (เช่น ในแอป LINE) ไม่ให้คัดลอกอัตโนมัติ → เลือกข้อความให้ กดค้างคัดลอกเอง
    const range = document.createRange();
    range.selectNodeContents($('text'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    $('copy').textContent = 'เลือกข้อความแล้ว กดค้างเพื่อคัดลอก';
  }
  setTimeout(() => { $('copy').textContent = 'คัดลอกผล'; }, 2500);
});
</script>
</body>
</html>
